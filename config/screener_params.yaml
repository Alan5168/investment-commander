# 选股参数配置
# 核心定位：量化腿筛出20-30只技术面合格的候选池
# 题材支撑+技术面 → 真正值得买入的标的

market_filter:
  # 大盘过滤规则（方案B）
  crash_threshold_1d: -0.03  # 昨日大盘跌>3% → 空仓
  crash_threshold_5d: -0.05  # 近5日大盘跌>5% → 空仓
  min_candidates: 10         # 候选数<10只 → 空仓

candidate_pool:
  # 候选池大小（扩大到20-30只）
  target_size: 25
  min_size: 15
  max_size: 30
  
  # 分层输出
  tiers:
    strong: 8      # 强势候选（技术面最强）
    normal: 12     # 普通候选（技术面合格）
    watchlist: 5   # 观察候选（等待确认）

  # ============ 主题配置（来源：long_term_tracking.json）============
  # 以下主题为"题材支撑"信号来源，满足技术面的同时叠加主题共振可提升胜率
  themes_from_research:
    - 脑机接口          # 2026前三月融资超去年全年，政策+资金双催化
    - 低空经济/eVTOL    # 政策密集催化，新基建主线
    - 卫星互联网        # 新基建主线
    - 生物制造          # 政策密集支持
    - 量子计算          # 前沿技术突破
    - 核聚变能          # 商业化进程加速
    - AI Agent/自主智能体  # 大模型落地加速
    - 人形机器人/具身智能  # 2026融资超200亿，宇树IPO
    - 商业航天          # SpaceX IPO预期
    - 固态电池          # 量产时间表
    - 固态变压器SST     # 国内商业化落地
    - AI算力            # 持续跟踪

  # 主题权重加成（主题+技术面双合格时加成分）
  theme_boost: 5  # 有主题支撑的标的额外+5分

technical_filters:
  # 技术面筛选条件
  volume_ratio_min: 1.2      # 量比≥1.2
  rsi_low: 35                # RSI低位回升
  zj_saturation_max: 85      # 主力饱和度上限
  ma_bullish: true           # MA多头排列

output:
  # 输出格式
  format: "markdown"
  include_disclaimer: true
  disclaimer: "⚠️ 以下仅为技术面筛选结果，有题材支撑的标的才具备投资价值"
